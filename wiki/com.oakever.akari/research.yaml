- id: ad-cooldown-timer
  title: Confirm the interstitial is a ~60 s cooldown since the last interstitial
    closed (rewarded ads do not reset it)
  kind: experiment
  requires: any
  status: open
  created: '2026-10-01T22:33:11'
  feature: ads-interstitial
  source: session
  plan: 'Hypothesis from the 108-120 log: starts 19-50 s after the previous interstitial
    closed had no ad (110,112,114,Restart 114,117,118,120); starts 60-147 s after
    had an ad (111,113,115,116,119); the Revive rewarded video 30 s before 116 did
    not block it. Do: after an interstitial closes, start the next levels at measured
    delays (about 20 s, 45 s, 55 s, 65 s, 90 s; idle on the board or win screen to
    stretch the time) and also a Restart at about 70 s. Log seconds-since-last-interstitial
    and ad yes/no. Confirmed if every start under ~50 s has no ad and every start
    over ~60 s has one, regardless of level parity and rewarded ads. Also test the
    new-session exception: the first level after an app launch had no ad 100-146 s
    after the last one (bench 20261001-1531: levels 87, 95, 103; 105-107 after restarts)
    - start a level 70+ s after an ad, once in the same session and once right after
    a relaunch.'
  note: 'more data fits the hypothesis: 62-70 (no ad 31-45 s, ad 71-92 s), 71-80 (no
    ad 35-44 s, ad 75-253 s, ad 47 s after a hint rewarded video), bench 83-107 (no ad
    33-35 s, ad 78-81 s) [s:20261001-091349-chrono-2FYKPJ#38] [s:20261001-100940-chrono-2FYKPJ#38]
    [s:20261001-172422-chrono-2FYKPJ#9]'
