# База игр под разбор. Весь процесс работает только по этому списку.
#
# Как добавить игру: одна запись = package Android-приложения (он же bundle id).
#   - package есть в адресе игры в Google Play: play.google.com/store/apps/details?id=com.king.candycrushsaga
#     -> id: com.king.candycrushsaga
#   - или на машине с телефоном: python harness/sw.py games — покажет игры на телефоне, какие уже в
#     списке, и готовые строки для вставки сюда.
#   Игра должна стоять на телефоне: агент её не устанавливает.
#
# Как изменить: на GitHub откройте этот файл → карандаш → правка → «Commit changes» → GitHub
# предложит pull request → «Merge». Машины подтянут изменения в течение часа (sw.py sync).
#
#   id        package из Google Play (обязательно)
#   title     название (для людей)
#   priority  меньше — важнее (по умолчанию — порядок в списке)
#   enabled   false — не разбирать
#   focus     на что обратить внимание в первую очередь (по желанию)
#
# Что уже изучено по игре — wiki/<id>/features.md.

games:
  - id: com.maroieqrwlk.unpin
    title: Pull the Pin

  - id: com.block.juggle
    title: Block Blast!

  - id: com.king.candycrushsaga
    title: Candy Crush Saga

  - id: com.vitastudio.mahjong
    title: Vita Mahjong

  - id: com.oakever.arrows
    title: Amaze GO!

  - id: com.oakever.meowdoku
    title: "Meowdoku: Brain Puzzle Games"

  - id: com.oakever.akari
    title: MeowTrail

  - id: com.crypt.gram.puzz
    title: "Cryptogram: Word Logic Puzzles"

  - id: com.SpektraGames.HighwayRacerPro.traffic.car.racing.game
    title: Highway Racer Pro

  - id: com.psv.drivex.racing.unlimited
    title: "Drive X Unlimited: Car Racing"

  - id: com.psv.racing_games.trafic.pro.racer
    title: Traffic Pro Racer

  - id: com.crime.superchero.open.world.war
    title: Superhero Crime Open World War

  - id: com.starplay.spider.fighter.openworld
    title: "Spider Fighter 3: Action Game"

  - id: com.nvsgames.snap
    title: MARVEL SNAP
    enabled: false         # PvP с живыми игроками: агент не играет против людей
