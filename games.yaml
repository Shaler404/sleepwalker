# Список игр и целей. Рутина перечитывает файл перед каждой сессией: правки действуют сразу,
# в том числе сделанные на GitHub (рутина делает git pull).
#
# Поля игры:
#   id        package из Google Play (игра должна стоять на телефоне)
#   title     название
#   priority  меньше — важнее (по умолчанию — порядок в списке)
#   enabled   false — не играть
#   goals     что изучить в этой игре; дописываются к общим целям из defaults
#
# Вид сессии выбирается сам:
#   onboard       игра ещё не изучена в первом приближении
#   update_diff   телефон обновил игру — что изменилось
#   event_scan    раз в event_scan_hours — события, попапы, магазин
#   deep_revisit  раз в revisit_hours — открытые цели и вопросы из вики
# Открытые вопросы, которые находит «сон», становятся целями следующих сессий сами.

defaults:
  event_scan_hours: 24
  revisit_hours: 72
  budget_min: {onboard: 30, update_diff: 20, event_scan: 10, deep_revisit: 25}
  goals:
    - Пройти обучение (FTUE) и описать его по шагам с кадрами
    - "Разобрать основной игровой цикл: что игрок делает, за что получает награду, где проигрывает"
    - "Разобрать экономику: валюты, источники и стоки, цены, таймеры, жизни и энергия"
    - "Разобрать монетизацию: магазин, офферы и когда они появляются, реклама за награду, баттл-пасс"
    - Отметить клипами ключевые моменты — основной цикл, победу и поражение, событие
  kind_goals:
    event_scan:
      - "Короткий осмотр: попапы при входе, раздел событий и новостей, магазин. Для каждого события — название, условия, награды, таймер. Ничего не проходить"
    update_diff:
      - Пройти по известным экранам из вики и отметить, что изменилось после обновления (NEW / CHANGED в заголовке mark)

