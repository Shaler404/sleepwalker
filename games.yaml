# The list of games to analyze. The whole process works only from this list.
#
# How to add a game: one entry = the package of the Android app (also known as the bundle id).
#   - the package is in the game's Google Play URL: play.google.com/store/apps/details?id=com.king.candycrushsaga
#     -> id: com.king.candycrushsaga
#   - or, on a machine with a phone: python harness/sw.py games — shows the games on the phone, which
#     are already in the list, and ready-made lines to paste here.
#   The game must be installed on the phone: the agent does not install it.
#
# How to change it: on GitHub open this file → pencil → edit → "Commit changes" → GitHub
# offers a pull request → "Merge". Machines pick up the changes within an hour (sw.py sync).
#
#   id        package from Google Play (required)
#   title     title (for humans)
#   priority  lower = more important (default: order in the list); still, a game gets at most
#             session.max_in_a_row sessions in a row (project.yaml) while other games have work, and a
#             game not played for session.turn_hours (or never) gets its turn first
#   enabled   false = do not analyze
#   focus     what to look at first (optional)
#   models    the models chosen when the game was onboarded (runbooks/onboard.md), per role with its
#             effort: {study: fable:xhigh, play: sonnet:low}; without it, project.yaml models
#
# A new game is onboarded first (runbooks/onboard.md): it is studied and its models are chosen on this
# machine, and only then is its line added here.
#
# What is already known about a game: wiki/<id>/features.md.

games:
  - id: com.maroieqrwlk.unpin
    title: Pull the Pin
    models: {play: "opus:low"}   # docs/bench/2026-10-01-play.md: 7 won, 1 lost; sonnet lost half its levels

  - id: com.block.juggle
    title: Block Blast!

  - id: com.king.candycrushsaga
    title: Candy Crush Saga

  - id: com.vitastudio.mahjong
    title: Vita Mahjong

  - id: com.oakever.arrows
    title: Amaze GO!

  - id: com.oakever.meowdoku
    title: "Meowdoku: Brain Puzzle Games"
    models: {play: "sonnet:low"}  # docs/bench/2026-10-01-play.md: 48.6 levels won an hour, $0.19 a level

  - id: com.oakever.akari
    title: MeowTrail
    models: {play: "sonnet:low"}  # docs/bench/2026-10-01-play.md: 36.4 levels won an hour, $0.18 a level

  - id: com.crypt.gram.puzz
    title: "Cryptogram: Word Logic Puzzles"
    # Off: every session that reaches the level 16 board dies with "Output blocked by content filtering
    # policy" (4 sessions, 2026-10-01): the model recognizes the encoded text while reasoning. Pass level 16
    # by hand on the phone, then turn it back on.
    enabled: false
