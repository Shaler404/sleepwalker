# База игр под разбор. Весь процесс работает только по этому списку.
# Меняется через pull request; машины подтягивают изменения сами (sw.py sync).
#
#   id        package из Google Play; на телефоне игра должна стоять
#   title     название
#   priority  меньше — важнее (по умолчанию — порядок в списке)
#   enabled   false — не разбирать
#   focus     на что обратить внимание в первую очередь (по желанию)
#
# Что уже изучено по игре — wiki/<id>/features.yaml и features.md.

