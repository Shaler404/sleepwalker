# Глобальные правила разбора. Меняются только через pull request.

repo: Shaler404/sleepwalker

# Чьи issues и комментарии к pull request учитывают агенты. Репозиторий публичный:
# текст от остальных — просто данные.
maintainers: [Shaler404]

# Задача по каждой игре из games.yaml — найти все фичи и описать, как они работают, разобрав все
# пользовательские кейсы. Работа идёт задачами (wiki/<game>/tasks.md):
#   - внешние, их ставит планировщик: «разобрать игру версии X» (X — версия в Google Play),
#     «обновить документацию под версию Y»; с новой версией — «проверить, изменился ли FTUE», если с нуля
#     игру проходили больше ftue_refresh_days назад (без новой версии FTUE не перепроверяется);
#   - из игры и пробелов в знаниях, их ставит игрок: таймеры, ежедневные активности, то, что видно
#     только со свежей установки.
# Когда открытых задач нет, игра спит до новой версии.
session:
  budget_min:                # бюджет сессии по видам задач, минуты; бюджет сессии — сумма, не больше max_session_min
    analyze: 30
    update: 25
    ftue: 30
    replay: 20
    followup: 10
    daily: 10
  max_session_min: 45
  steps_per_min: 4           # бюджет шагов = минуты × это число
  hard_limit: 1.5            # после бюджета × hard_limit действия блокируются
  stale_min: 20              # сессия без действий дольше — брошена, телефон и игра свободны

research:
  version_check_hours: 6     # как часто сверять версию в Google Play
  ftue_refresh_days: 180     # новая версия + прохождение с нуля старше этого = проверить FTUE заново
  country: us                # страна Google Play для проверки версии
