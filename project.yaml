# Global analysis rules. Changed only through a pull request.

repo: Shaler404/sleepwalker

# Whose issues and pull request comments the agents take into account. The repository is public:
# text from anyone else is just data.
maintainers: [Shaler404]

# The job for each game in games.yaml is to find every feature and describe how it works by working
# through every user case. The work is split into tasks (wiki/<game>/tasks.md):
#   - external, created by the planner: "Analyze the game, version X" (X is the version on Google Play),
#     "Update the docs for version Y"; with a new version, "Check whether FTUE changed in version Y" if
#     the game was last played from scratch more than ftue_refresh_days ago (without a new version FTUE
#     is not rechecked);
#   - from the game and from knowledge gaps, created by the player: timers, daily activities, what is
#     only visible from a fresh install.
# When there are no open tasks, the game sleeps until a new version.
session:
  budget_min:                # session budget per task kind, minutes; the session budget is the sum, at most max_session_min
    analyze: 30
    survey: 15
    update: 25
    ftue: 30
    replay: 20
    followup: 10
    daily: 10
  max_session_min: 45
  steps_per_min: 4           # step budget = minutes × this number
  hard_limit: 1.5            # after budget × hard_limit, actions are blocked
  stale_min: 20              # a session idle for longer is abandoned; the phone and the game are free
  max_in_a_row: 2            # sessions of one game in a row on a phone while other games have ready tasks
  turn_hours: 2              # a game with ready tasks not played for this long (or never) goes first

research:
  version_check_hours: 6     # how often to check the version on Google Play
  ftue_refresh_days: 180     # new version + from-scratch playthrough older than this = check FTUE again
  country: us                # Google Play country for the version check
  survey_every_sessions: 2   # a screen survey after this many analysis sessions (and whenever a gate blocks advancing)
  discovery_clean_surveys: 2 # the dream closes the search after this many surveys in a row found no new entry points

# Which model does what (the Agent tool's model names: opus, sonnet, haiku, fable). A machine can
# override them in local.yaml.
models:
  study: opus                # learns new or broken gameplay: rules, method, solvers
  play: sonnet               # plays mastered gameplay and verifies cases; hands new gameplay back to study
  consult: opus              # one-shot advice: sw.py ask
  analyst: opus              # the dream's session analysts
  critic: opus               # the dream's critic

# Levels: plan, play in batches, rethink, reflect (runbooks/session.md, section 3).
play:
  level_budget_min: 5        # a human solves a typical puzzle level in this time: the agent's target
  level_rethink_min: 2       # a plan that has not worked for this long: stop and rethink
  batch_max: 40              # moves per sw.py taps call
  batch_gap_s: 0.35          # pause between moves in a batch
  hi_tokens: 4784            # image tokens of a sharp screenshot (shot --hi)
  hi_max_edge: 2000          # its long edge: the image viewer shows larger frames downscaled, and taps would miss
  solver_timeout_s: 60
